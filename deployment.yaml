apiVersion: apps/v1
kind: Deployment
metadata:
  name: growcast-deployment
  labels:
    app: growcast
spec:
  replicas: 2
  selector:
    matchLabels:
      app: growcast
  template:
    metadata:
      labels:
        app: growcast
    spec:
      containers:
      - name: growcast-container
        image: jjwon0407/growcast:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3030
        env:
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: growcast-secret
              key: db-url
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: growcast-secret
              key: db-username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: growcast-secret
              key: db-password
        - name: GCS_NAME
          valueFrom:
            secretKeyRef:
              name: growcast-secret
              key: gcs-name
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /etc/secrets/gcs/gcs.json
        volumeMounts:
        - name: gcs-config-volume
          mountPath: /etc/secrets/gcs
          readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: gcs-config-volume
        secret:
          secretName: gcs-config

---
apiVersion: v1
kind: Service
metadata:
  name: growcast-service
  labels:
    app: growcast
spec:
  selector:
    app: growcast
  type: LoadBalancer
  ports:
  - protocol: TCP
    port: 3030
    targetPort: 3030